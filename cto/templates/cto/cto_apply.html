{% extends "base.html" %}
{% block title %}Apply for CTO — BDH HRIS{% endblock %}
{% block content %}
<h1>Apply for CTO</h1>
<p>Available CTO balance: <strong style="color:var(--navy-900);">{{ balance }} day(s)</strong></p>

<div class="card form-card">
  <form method="post" class="form-2col">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
  </form>
</div>
{% endblock %}
